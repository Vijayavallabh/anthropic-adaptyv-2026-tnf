[project]
name = "adaptyv-egfr"
version = "0.1.0"
description = "De-novo conditional protein-binder design and validation pipeline"
readme = "README.md"
authors = [
    { name = "Vijayavallabh" }
]
requires-python = ">=3.12"
dependencies = [
    "anarcism>=1.0.1",
    "anthropic>=1.9.0",
    "biopython>=1.88",
    "freesasa>=2.2.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pdb2pqr>=3.7.1",
    "propka>=3.5.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[project.scripts]
adaptyv-egfr = "adaptyv_egfr:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Only our tests - never recurse into the vendored third_party/ kit test suites.
testpaths = ["tests"]
addopts = "-q"
